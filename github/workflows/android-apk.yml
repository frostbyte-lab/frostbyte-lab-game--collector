name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - run: pnpm install --no-frozen-lockfile

      - name: Generate Android project
        working-directory: android-app
        run: pnpm exec expo prebuild --platform android --non-interactive --clean

      - name: Build APK
        working-directory: android-app
        run: ./android/gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ZipScope-android-release
          path: android-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
