<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fixture: Simple Game</title>
  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; margin: 0; padding: 12px; }
    #game { width: 640px; height: 360px; background: #111; display: block; margin: 12px 0; }
    button { padding: 8px 12px; font-size: 16px; }
  </style>
</head>
<body>
  <h1>Fixture: Simple Game</h1>
  <p>Canvas animation + simulated XHR fetch for integration testing.</p>
  <canvas id="game" width="640" height="360"></canvas>
  <div>
    <button id="xhr">Trigger XHR (simulate API)</button>
  </div>
  <script>
    const cvs = document.getElementById('game');
    const ctx = cvs.getContext('2d');
    let t = 0;
    function frame() {
      t += 0.02;
      const w = cvs.width, h = cvs.height;
      ctx.fillStyle = '#081';
      ctx.fillRect(0,0,w,h);
      ctx.fillStyle = '#fff';
      ctx.font = '18px sans-serif';
      ctx.fillText('Simple Fixture — FPS demo', 14, 30);
      for (let i=0;i<8;i++){
        const x = w/2 + Math.cos(t + i) * 120;
        const y = h/2 + Math.sin(t*1.2 + i) * 80;
        ctx.beginPath(); ctx.arc(x,y,14,0,Math.PI*2); ctx.fill();
      }
      requestAnimationFrame(frame);
    }
    frame();

    document.getElementById('xhr').addEventListener('click', async () => {
      try {
        const res = await fetch('./api/data.json');
        const j = await res.json();
        alert('XHR ok: ' + JSON.stringify(j));
      } catch(e) { alert('XHR fail: ' + e); }
    });
  </script>
</body>
</html>
